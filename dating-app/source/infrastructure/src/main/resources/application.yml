spring:
  application:
    name: dating-app
  datasource:
    url: "jdbc:mysql://localhost:3306/dating_app?useSSL=false&allowPublicKeyRetrieval=true"
    username: dating_app
    password: dating_app
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://todo.replace.example.com"
  data:
    redis:
      host: localhost
      port: 6379
  threads:
    virtual:
      enabled: true

logging:
  pattern:
    dateformat: "dd.MM.yyyy HH:mm:ss.SSS"

springdoc:
  default-produces-media-type: "application/json"