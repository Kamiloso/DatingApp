name: dating-app

services:
  db:
    image: mysql:8.0
    container_name: dating-app-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - app-network
    volumes:
      - ./my-sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-e", "DESC internal.db_ready;"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:alpine
    container_name: dating-app-redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    container_name: dating-app-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dating_app?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: 'redis'
      SPRING_DATA_REDIS_PORT: '6379'
      APP_LIMITING_ALLOW_DEBUG_ENDPOINTS: 'false'
    networks:
      - app-network
    volumes:
      - ./backend/application.yml:/app/config/application.yml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: