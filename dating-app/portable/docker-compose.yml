name: dating-app

services:
  db:
    image: mysql:8.0
    container_name: dating-app-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - app-network
    volumes:
      - ./my-sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-e", "DESC internal.db_ready;"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:alpine
    container_name: dating-app-redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    container_name: dating-app-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    networks:
      - app-network
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./keycloak/HealthCheck.java:/opt/keycloak/HealthCheck.java:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "java /opt/keycloak/HealthCheck.java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend:
    container_name: dating-app-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dating_app?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: 'redis'
      SPRING_DATA_REDIS_PORT: '6379'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/dating-app-realm
    networks:
      - app-network
    volumes:
      - ./backend/application.yml:/app/config/application.yml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: