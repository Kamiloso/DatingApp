app:
  start-message: "Backend has started successfully and is listening for requests..."
  auth:
    url: "https://accounts.google.com"
    client-id: not-configured-yet
    allowed-email-regex: "@student\\.polsl\\.pl$"
  limits:
    max-batch-size: 512
    max-list-size: 64
  retry:
    max-retries: 6
    initial-sleep-millis: 100
    sleep-time-multiplier: 2.0
  matching:
    match-count-limit: 3
    max-age-difference: 3
    schedule:
      cron: "0 0 20 * * MON,THU"
      timezone: "Europe/Warsaw"
      lock-at-least-for-minutes: 5
      lock-at-most-for-minutes: 30
  quiz:
    ready-index: 1