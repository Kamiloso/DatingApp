services:
  db:
    ports:
      - "3306:3306"
    volumes:
      - type: tmpfs
        target: /var/lib/mysql

  redis:
    ports:
      - "6379:6379"

  backend:
    profiles:
      - ignore

  mail:
    image: python:3.10-alpine
    container_name: dating-app-mail
    command: python -u -m smtpd -n -c DebuggingServer 0.0.0.0:1025
    ports:
      - "1025:1025"
    networks:
      - app-network