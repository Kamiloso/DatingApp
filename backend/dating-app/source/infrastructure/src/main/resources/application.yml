spring:
  application:
    name: "dating-app"
  datasource:
    url: "jdbc:mysql://db:3306/dating_app?useSSL=false&allowPublicKeyRetrieval=true"
    username: "dating_app"
    password: "dating_app"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  mvc:
    problem-details:
      enabled: true
  data:
    redis:
      host: "redis"
      port: 6379
  threads:
    virtual:
      enabled: true

logging:
  pattern:
    dateformat: "dd.MM.yyyy HH:mm:ss.SSS"

springdoc:
  default-produces-media-type: "application/json"

app:
  is-development-mode: false
  email:
    credentials:
      host: ~
      port: ~
      username: ~
      password: ~
      from-email: ~